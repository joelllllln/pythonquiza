<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>PyQuiz — Python practice</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/material-darker.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="logo">🐍</span> <b>PyQuiz</b></div>
  <nav class="tabs">
    <button class="tab on" data-view="practice">Practice</button>
    <button class="tab" data-view="stats">Stats</button>
    <button class="tab" data-view="bank">Bank</button>
  </nav>
  <div class="who">
    <span id="level-chip" class="chip" title="Your skill level">Lv —</span>
    <button id="signin" class="btn small">Sign in</button>
    <div id="account" class="account hidden">
      <img id="avatar" alt="" referrerpolicy="no-referrer">
      <button id="signout" class="btn small ghost">Sign out</button>
    </div>
  </div>
</header>

<div id="banner" class="banner hidden"></div>

<!-- ============ PRACTICE ============ -->
<main id="view-practice" class="view">
  <section class="panel prompt-panel">
    <div class="q-head">
      <div>
        <h2 id="q-title">Loading…</h2>
        <div class="meta">
          <span id="q-topic" class="pill"></span>
          <span id="q-diff" class="pill diff"></span>
          <span id="q-timer" class="pill time">0:00</span>
        </div>
      </div>
      <button id="skip" class="btn ghost small">Skip</button>
    </div>
    <div id="q-body" class="q-body"></div>

    <div class="diffctl">
      <label for="diff-slider">Difficulty tuning <span id="diff-val">±0.0</span></label>
      <input id="diff-slider" type="range" min="-400" max="400" step="10" value="0">
      <div class="hint-row">
        <span class="muted" id="target-label"></span>
        <button id="hint-btn" class="btn ghost small">Hint</button>
      </div>
      <div id="hint-box" class="hintbox hidden"></div>
    </div>
  </section>

  <section class="panel code-panel">
    <div class="code-head">
      <span class="muted">solution.py</span>
      <div class="code-actions">
        <button id="reset-code" class="btn ghost small">Reset</button>
        <button id="run" class="btn small">▶ Run</button>
        <button id="submit" class="btn primary small">Submit</button>
      </div>
    </div>
    <div id="editor-wrap"><textarea id="editor"></textarea></div>
    <div class="out-head">
      <span class="muted">Output</span>
      <span id="run-status" class="muted"></span>
    </div>
    <pre id="output" class="output">Loading Python…</pre>
    <div id="results" class="results"></div>
    <div id="next-row" class="next-row hidden">
      <button id="show-sol" class="btn ghost small">Show solution</button>
      <button id="next" class="btn primary">Next question →</button>
    </div>
  </section>
</main>

<!-- ============ STATS ============ -->
<main id="view-stats" class="view hidden">
  <section class="panel">
    <h2>Your progress</h2>
    <div class="cards">
      <div class="card"><div class="big" id="s-level">—</div><div class="lbl">Level</div></div>
      <div class="card"><div class="big" id="s-acc">—</div><div class="lbl">Accuracy</div></div>
      <div class="card"><div class="big" id="s-streak">—</div><div class="lbl">Streak</div></div>
      <div class="card"><div class="big" id="s-solved">—</div><div class="lbl">Solved</div></div>
      <div class="card"><div class="big" id="s-attempts">—</div><div class="lbl">Attempts</div></div>
      <div class="card"><div class="big" id="s-time">—</div><div class="lbl">Median time</div></div>
    </div>
  </section>

  <section class="panel">
    <h3>Level over time</h3>
    <svg id="chart" viewBox="0 0 600 180" preserveAspectRatio="none" class="chart"></svg>
    <div class="muted small" id="chart-note"></div>
  </section>

  <section class="panel">
    <h3>Topics</h3>
    <div id="topics" class="topics"></div>
  </section>

  <section class="panel">
    <h3>Recent attempts</h3>
    <div id="history" class="history"></div>
    <div class="row-end">
      <button id="export" class="btn ghost small">Export JSON</button>
      <button id="reset-progress" class="btn ghost small danger">Reset progress</button>
    </div>
  </section>
</main>

<!-- ============ BANK ============ -->
<main id="view-bank" class="view hidden">
  <section class="panel">
    <h2>Question bank</h2>
    <div class="filters">
      <input id="bank-search" placeholder="Search…" >
      <select id="bank-topic"><option value="">All topics</option></select>
      <select id="bank-state">
        <option value="">All</option>
        <option value="unseen">Unseen</option>
        <option value="solved">Solved</option>
        <option value="failed">Failed / unsolved</option>
      </select>
    </div>
    <div id="bank-list" class="bank-list"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/python/python.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="js/questions.js"></script>
<script src="js/questions_extra.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
